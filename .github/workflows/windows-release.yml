name: Windows checks and release

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'core/**'
      - 'tests/**'
      - 'publish.ps1'
      - 'release-notes/**'
      - '.github/workflows/windows-release.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-home
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet-sdk
  DOTNET_BUNDLE_EXTRACT_BASE_DIR: ${{ github.workspace }}/.temp/bundle
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
  DOTNET_NOLOGO: '1'

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run playback and persistence regression checks
        run: dotnet run --project tests/SpotifyPopup.LogicChecks -c Release
      - name: Build Windows UI checks with warnings treated as errors
        run: dotnet build tests/SpotifyPopup.Checks -c Release -warnaserror
      - name: Run isolated Windows UI checks
        run: dotnet run --project tests/SpotifyPopup.Checks -c Release --no-build
      - name: Publish standalone executable
        shell: pwsh
        run: ./publish.ps1
      - name: Verify standalone startup and executable icon
        shell: pwsh
        run: ./tests/Smoke-Published.ps1
      - name: Upload executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPopup-win-x64
          path: |
            core/bin/publish/win-x64/SpotifyPopup.exe
            core/bin/publish/win-x64/SpotifyPopup.exe.sha256
          if-no-files-found: error
      - name: Upload UI verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-UI-checks
          path: test-results/*.png
          if-no-files-found: ignore

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: SpotifyPopup-win-x64
          path: release-assets
      - name: Publish versioned GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$project = Get-Content 'core/SpotifyPopup.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable semantic version is required.' }
          $tag = "v$version"
          $notes = "release-notes/$tag.txt"
          if (!(Test-Path $notes)) { throw "Release notes missing: $notes" }
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft,targetCommitish 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft) {
              Write-Host "Release $tag is already published; bump the project version to publish a new release."
              exit 0
            }
            if ($release.targetCommitish -ne $env:GITHUB_SHA) { throw 'A draft release already targets another commit.' }
            gh release upload $tag 'release-assets/SpotifyPopup.exe' 'release-assets/SpotifyPopup.exe.sha256' --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag 'release-assets/SpotifyPopup.exe' 'release-assets/SpotifyPopup.exe.sha256' --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Spotify Popup $tag" --notes-file $notes --draft
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url --jq '.url'
      - name: Remove merged development branches
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only remove feature refs already contained in the release commit.
          # Use the paginated branch listing so previous merged features can also be cleaned.
          $entries = @(gh api --paginate "repos/$env:GITHUB_REPOSITORY/branches?per_page=100" --jq '.[] | [.name, .commit.sha] | @tsv')
          if ($LASTEXITCODE -ne 0) { throw 'Could not list repository branches.' }
          foreach ($entry in $entries) {
            $parts = $entry -split "`t", 2
            if ($parts.Count -ne 2) { throw 'Invalid branch response from GitHub.' }
            $branch = [string]$parts[0]
            $head = [string]$parts[1]
            if (!$branch.StartsWith('feat/')) { continue }
            $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/$head...$env:GITHUB_SHA" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not compare ${branch} with main." }
            if ($comparison.behind_by -ne 0) {
              Write-Host "Keeping ${branch}: unmerged commits remain."
              continue
            }
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branch"
            if ($LASTEXITCODE -ne 0) { throw "Could not delete merged branch ${branch}." }
            Write-Host "Removed merged branch ${branch}."
          }
